name: Production Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'

jobs:
  release-hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/release-verify.mjs

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Build same-origin production bundle
        env:
          VITE_API_URL: /api
          VITE_SOCKET_URL: ''
        run: npm run build
      - name: Assert fresh build output
        run: test -s dist/index.html && test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  database-integration:
    name: Mongo transaction integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start MongoDB replica set
        run: |
          docker run -d --name smart-lf-mongo -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if docker exec smart-lf-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; then break; fi
            sleep 2
          done
          docker exec smart-lf-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in {1..30}; do
            if docker exec smart-lf-mongo mongosh --quiet --eval "rs.status().myState" | grep -q 1; then exit 0; fi
            sleep 2
          done
          docker logs smart-lf-mongo
          exit 1
      - name: Install backend
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Run transaction and refresh-race test
        working-directory: backend
        env:
          RUN_DB_INTEGRATION: 'true'
          MONGO_URI: mongodb://127.0.0.1:27017/smart-lf-integration?replicaSet=rs0
          JWT_ACCESS_SECRET: integration-test-secret-that-is-longer-than-32-characters
          CLIENT_URLS: http://localhost:3000
        run: node --test tests/database.integration.test.js
      - if: always()
        run: docker rm -f smart-lf-mongo || true

  compose-smoke:
    name: Container stack and auth smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend, database-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral test secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REDIS_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=CiAdmin!$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build clean images
        run: docker compose build --no-cache
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Seed safe defaults and bootstrap one test admin
        run: |
          docker compose exec -T backend node scripts/seedDefaults.js
          docker compose exec -T \
            -e CONFIRM_BOOTSTRAP_ADMIN=YES \
            -e ADMIN_EMAIL=ci-admin@example.com \
            -e ADMIN_NAME='CI Admin' \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            backend node scripts/bootstrapAdmin.js
      - name: Verify proxied readiness and cookie-CSRF login
        run: |
          curl --fail --retry 12 --retry-delay 3 http://127.0.0.1:3000/health
          curl --fail http://127.0.0.1:3000/api/health/ready
          curl --fail -c cookies.txt http://127.0.0.1:3000/api/auth/csrf > csrf.json
          TOKEN=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('csrf.json')).data.csrfToken)")
          curl --fail -b cookies.txt -c cookies.txt \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $TOKEN" \
            --data "{\"email\":\"ci-admin@example.com\",\"password\":\"$ADMIN_PASSWORD\"}" \
            http://127.0.0.1:3000/api/auth/login
          curl --fail -b cookies.txt http://127.0.0.1:3000/api/auth/me
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v --remove-orphans
