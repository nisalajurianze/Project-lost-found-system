name: Build Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0-rc.1)
        required: true

permissions:
  contents: read

jobs:
  release-images:
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image without publishing
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: smart-lost-found-backend:${{ inputs.version }}
      - name: Build frontend image without publishing
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: |
            VITE_API_URL=/api
            VITE_SOCKET_URL=
          tags: smart-lost-found-frontend:${{ inputs.version }}
      - name: Deployment safety note
        run: |
          echo 'Images built successfully.'
          echo 'Production deployment must use one HTTPS site (or same-site custom domains), managed MongoDB replica set, authenticated Redis, Cloudinary, and email credentials.'
          echo 'Default Vercel + Render domains are intentionally not auto-deployed because cross-site cookie authentication would be unsafe/incompatible.'
