name: smart-lost-found

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--quiet"]
    volumes:
      - mongodb_data:/data/db
    networks: [internal]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1:27017 --eval
          "try { const s=rs.status(); quit(s.ok===1?0:1) }
          catch(e) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); quit(0) }
          catch(initError) { quit(1) } }"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in a local .env file}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URLS: http://localhost:${APP_PORT:-3000}
      MONGO_URI: mongodb://mongodb:27017/smart-lost-found?replicaSet=rs0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REQUIRE_REDIS: "true"
      REQUIRE_CLOUDINARY: "false"
      REQUIRE_EMAIL_PROVIDER: "false"
      COOKIE_SECURE: "false"
      JOBS_ENABLED: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a random JWT_ACCESS_SECRET of at least 32 characters}
      EMAIL_FROM: ${EMAIL_FROM:-Smart Lost & Found <noreply@example.invalid>}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.invalid}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=4m,mode=0755
    ports:
      - "${APP_PORT:-3000}:8080"
    depends_on:
      backend: { condition: service_healthy }
    networks:
      - internal
      - edge
    security_opt: ["no-new-privileges:true"]

volumes:
  mongodb_data:
  redis_data:

networks:
  internal:
    internal: true
  edge:
